<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link rel="stylesheet" href="/css/stylee.css">
    <h1>smartphones</h1>
   
   <div class="product-grid">
  
      <div class="phone-card">
       
        <div class="phone-image"><img src="assets/images/iphon17.jfif" alt="iPhone 17 Pro"></div>
        <h3 class="phone-title">iPhone 17 Pro</h3>
        <p class="phone-price">$999</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="phone-card">
        <div class="badge">Hot!</div>
        <div class="phone-image"><img src="assets/images/samsungs26.webp" alt="Galaxy S26 Ultra"></div>
        <h3 class="phone-title">Iphone 13 pro max</h3>
        <p class="phone-price">$1,199</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="phone-card">
        <div class="badge hidden"></div>
        <div class="phone-image"><img src="assets/images/iphon15.webp" alt="iPhone 15 Pro"></div>
        <h3 class="phone-title">iPhone 15 Pro</h3>
        <p class="phone-price">$899</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="phone-card">
        <div class="badge">New</div>
        <div class="phone-image"><img src="assets/images/onplus14" alt="OnePlus 14"></div>
        <h3 class="phone-title">OnePlus 14</h3>
        <p class="phone-price">$699</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="phone-card">
        <div class="badge">Hot</div>
        <div class="phone-image"><img src="assets/images/samsung z fold7.jfif" alt="Samsung Z Fold 7"></div>
        <h3 class="phone-title">Samsung Z Fold 7</h3>
        <p class="phone-price">$999</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="phone-card">
        <div class="badge">Sale</div>
        <div class="phone-image"><img src="assets/images/galaxy fold 7.jfif" alt="Galaxy Fold 7"></div>
        <h3 class="phone-title">Galaxy Fold 7</h3>
        <p class="phone-price">$1,199</p>
        <button class="buy-btn">Buy Now</button>
      </div>

   </div>

    

    
</body>
</html>
